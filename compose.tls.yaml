# Optional HTTPS front for local development and device testing.
#
# Use together with the base file:
#   docker compose -f compose.dev.yaml -f compose.tls.yaml up -d
#
# Certificates come from a self-signed local CA that is deliberately kept
# outside this repository. Point FLY001_LOCAL_CA_DIR at the directory holding
# `Caddyfile` and `certs/{server.crt,server.key}`, for example the
# ../local-ca directory generated by local-ca/issue-cert.sh in the workspace.
#
# Set APP_URL in .env to the matching HTTPS origin, otherwise generated links
# and subscription metadata still advertise the HTTP address.
#
# TLS_BIND_ADDRESS defaults to loopback only. Binding it to 0.0.0.0 exposes the
# panel to the whole LAN, so do that only on a trusted network and only for the
# duration of a device test.
services:
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - xboard
    ports:
      - "${TLS_BIND_ADDRESS:-127.0.0.1}:${TLS_PORT:-7443}:443"
    volumes:
      - ${FLY001_LOCAL_CA_DIR:-../local-ca}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FLY001_LOCAL_CA_DIR:-../local-ca}/certs:/certs:ro
